# The domain model is the contract the rest of the app is built against, so it
# must compile under strict TypeScript before it can reach main.

name: Typecheck and build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # A broken build must fail the PR, not the deployment.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /Bike-Fitting-Tool
