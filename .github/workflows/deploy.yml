# Builds one GitHub Pages site containing BOTH environments:
#
#   main    -> https://<user>.github.io/Bike-Fitting-Tool/
#   develop -> https://<user>.github.io/Bike-Fitting-Tool/dev/
#
# Next.js bakes basePath in at build time, so the two environments are two
# separate BUILDS, not one artifact copied twice.
#
# During the migration the two branches are not the same kind of project: one
# may still be plain static HTML while the other is already a Next app. Each
# checkout is therefore detected independently - if it has a Next config it is
# built, otherwise its files are published as they are. That is what lets
# develop move to Next without main breaking. See app-architecture.md risk R1.

name: Deploy Pages

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_BASE: /Bike-Fitting-Tool

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v5
        with:
          ref: main
          path: src-main

      - name: Check out development branch
        id: dev
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: develop
          path: src-develop

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assemble site
        run: |
          set -euo pipefail

          # $1 checkout dir, $2 output dir, $3 basePath, $4 env name
          build_env() {
            local src="$1" out="$2" base="$3" name="$4"
            local sha
            sha="$(git -C "$src" rev-parse --short HEAD)"
            mkdir -p "$out"

            if [ -f "$src/next.config.mjs" ] || [ -f "$src/next.config.js" ]; then
              echo "::group::Building $name with Next.js (basePath $base)"
              ( cd "$src" \
                && npm ci --no-audit --no-fund \
                && BASE_PATH="$base" \
                   NEXT_PUBLIC_ENV_NAME="$name" \
                   NEXT_PUBLIC_ENV_SHA="$sha" \
                   npm run build )
              # `output: export` writes to out/
              rsync -a "$src/out/" "$out/"
              echo "::endgroup::"
            else
              # Legacy path: the branch is still plain static HTML. Copy only
              # what is meant to be public - an allow-list, so config files and
              # sources cannot leak in by accident. This branch of the function
              # can be deleted once both branches are Next apps.
              echo "::notice::$name has no Next config - publishing its static files"
              cp "$src/index.html" "$out/"
              [ -d "$src/assets" ] && rsync -a "$src/assets/" "$out/assets/"
              # The legacy static page reads this at runtime.
              {
                printf 'window.BFT_ENV = {\n'
                printf '  name: "%s",\n'   "$name"
                printf '  sha: "%s",\n'    "$sha"
                printf '  builtAt: "%s"\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                printf '};\n'
              } > "$out/env.js"
            fi
          }

          mkdir -p _site
          build_env src-main _site "$SITE_BASE" production

          if [ -d src-develop ]; then
            build_env src-develop _site/dev "$SITE_BASE/dev" development
          else
            echo "::warning::branch 'develop' not found - development build skipped"
          fi

          # Keep the development build out of search results.
          printf 'User-agent: *\nDisallow: /dev/\n' > _site/robots.txt

          echo "--- published tree ---"
          find _site -maxdepth 2 -not -path '*/.*' | sort | head -40

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
